name: Check website

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  check-site:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Check HTML and links
        run: python scripts/check_site.py