name: Check website

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  check-site:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Check HTML and links
        run: python scripts/check_site.py

  test-worker:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: conference-api/package-lock.json

      - name: Install Worker dependencies
        working-directory: conference-api
        run: npm ci

      - name: Test Worker
        working-directory: conference-api
        run: npm test -- --run

      - name: Check administrative dependency integrity and test isolation
        run: node scripts/security-static-checks.mjs

      - name: Test public verification and complete exports
        run: node --test scripts/security-client.test.mjs

      - name: Test vendor integrity with Windows Git line endings
        run: node --test scripts/security-vendor-checkout.test.mjs

      - name: Test compact registration PDF exports
        run: node --test scripts/security-registration-roster.test.mjs
